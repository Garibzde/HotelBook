services:
  postgres:
    image: postgres:16
    container_name: hotelbook-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hotelbook
      POSTGRES_PASSWORD: hotelbook_pass
      POSTGRES_DB: hotelbook
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: